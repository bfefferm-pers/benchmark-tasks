[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-steamer-basket"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_steamer_basket = "steamer_basket.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["steamer_basket*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-sprinkler-arc"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_sprinkler = "sprinkler_arc.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["sprinkler_arc*"]

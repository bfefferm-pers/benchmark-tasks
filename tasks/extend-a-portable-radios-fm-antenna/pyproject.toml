[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-radio-antenna"
version = "0.0.1"

[project.entry-points."inspect_robots.embodiments"]
yam_radio_antenna = "radio_antenna.embodiment:make_embodiment"

[tool.setuptools.packages.find]
include = ["radio_antenna*"]
